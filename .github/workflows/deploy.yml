name: Build and Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: "cars-514510"
  REGION: "europe-north1"
  REPO_NAME: "cars-repo"
  SERVICE_NAME: "cars-service"
  IMAGE_NAME: "europe-north1-docker.pkg.dev/cars-514510/cars-repo/cars-service:${{ github.sha }}"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Google Cloud Authentication
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/413079248081/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@cars-514510.iam.gserviceaccount.com'

      - name: Configure Docker for Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build OCI Image with Spring Boot
        run: |-
          mvn spring-boot:build-image -Dspring-boot.build-image.imageName=${{ env.IMAGE_NAME }}

      - name: Push Image to Artifact Registry
        run: |-
          docker push ${{ env.IMAGE_NAME }}

      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}
          flags: '--allow-unauthenticated --memory=1024Mi'
