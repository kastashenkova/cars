server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: SECURITY_SESSION_COOKIE
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
      timeout: 30m

spring:
  application:
    name: cars

  threads:
    virtual:
      enabled: true

  web:
    resources:
      chain:
        enabled: true
        strategy:
          content:
            enabled: true
            paths: /**

  mvc:
    problem-details:
      enabled: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL:jdbc:h2:mem:carsdb;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-NO_TRACE}] %-5level %logger{36} - %msg%n"

gcp:
  storage:
    bucket-name: "cars-514510-storage"

management:
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  endpoints:
    access:
      default: read-only
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers, env, beans, mappings, configprops, conditions, threaddump, heapdump, httpexchanges, auditevents, logfile, startup, scheduledtasks, customapp, features, shutdown
  endpoint:
    loggers:
      access: unrestricted
    features:
      access: unrestricted
    customapp:
      access: unrestricted
    shutdown:
      access: unrestricted
    heapdump:
      access: read-only
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
    env:
      show-values: when-authorized
      roles: ADMIN
    configprops:
      show-values: when-authorized
      roles: ADMIN

info:
  app:
    name: "Actuator Cars Service"
    description: "Actuator example"
    version: "1.0.0"
  organization: "Kyiv-Mohyla Academy"

actuator:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASS:admin123}